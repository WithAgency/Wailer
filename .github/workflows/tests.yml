name: Quality & Tests

on: [push, pull_request]

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Setup uv
              uses: astral-sh/setup-uv@v10.0.1

            - name: Ruff check
              run: |
                  uv run ruff check .
                  uv run ruff format --check .

            - name: Mypy
              run: uv run mypy

    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
                django-version: ["4.2", "5.0", "5.1", "5.2", "6.0", "6.1"]
                exclude:
                    # Django < 5.0 does not support Python 3.13+
                    - python-version: "3.13"
                      django-version: "4.2"
                    - python-version: "3.14"
                      django-version: "4.2"
                    # Django 5.0/5.1 do not support Python 3.13+ either
                    - python-version: "3.13"
                      django-version: "5.0"
                    - python-version: "3.14"
                      django-version: "5.0"
                    - python-version: "3.14"
                      django-version: "5.1"
                    # Django 5.2 does not support Python 3.14
                    - python-version: "3.14"
                      django-version: "5.2"
                    # Django 6.x requires Python 3.12+
                    - python-version: "3.10"
                      django-version: "6.0"
                    - python-version: "3.11"
                      django-version: "6.0"
                    - python-version: "3.10"
                      django-version: "6.1"
                    - python-version: "3.11"
                      django-version: "6.1"

        steps:
            - uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: "22"

            - name: Setup uv
              uses: astral-sh/setup-uv@v10.0.1
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Run tests
              run: >
                  uv run --with "Django~=${{ matrix.django-version }}.0" pytest
                  demo
